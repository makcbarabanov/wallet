# Temporary HTTP-only bootstrap for ACME + smoke test
server {
    listen 80;
    listen [::]:80;
    server_name wallet.islanddream.ru;

    root /home/makc/Projects/wallet/public;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
