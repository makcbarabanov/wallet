# wallet.islanddream.ru — static review UI
#
# Activation:
#   sudo cp /home/makc/Projects/wallet/nginx.conf /etc/nginx/sites-available/wallet.conf
#   sudo cp /home/makc/Projects/wallet/nginx.conf /etc/nginx/sites-enabled/wallet.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # TLS (if cert missing):
#   docker run --rm \
#     -v /etc/letsencrypt:/etc/letsencrypt \
#     -v /var/lib/letsencrypt:/var/lib/letsencrypt \
#     -v /home/makc/Projects/wallet/public:/var/www/wallet \
#     certbot/certbot certonly --webroot -w /var/www/wallet \
#     -d wallet.islanddream.ru --agree-tos -m makc@islanddream.ru --non-interactive
#   then re-copy this conf (HTTPS block) and reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name wallet.islanddream.ru;

    root /home/makc/Projects/wallet/public;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.islanddream.ru;

    ssl_certificate /etc/letsencrypt/live/wallet.islanddream.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.islanddream.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/makc/Projects/wallet/public;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    # do not serve other hidden files
    location ~ /\. {
        deny all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8012/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Valet admin: logs / open questions / knowledge base
    location = /logs {
        try_files /logs/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /logs/ {
        try_files /logs/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
